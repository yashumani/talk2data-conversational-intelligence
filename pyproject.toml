[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talk2data-conversational-intelligence"
version = "0.5.0"
description = "Governed conversational intelligence for enterprise data using Ollama and Hermes Agent."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Talk2Data Contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6.0.2,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
talk2data = [
  "resources/domain_packs/*.yaml",
  "resources/physical_mappings/*.yaml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live_ollama: integration test that requires a running local Ollama model",
  "live_postgres: integration test that requires a running PostgreSQL reference schema",
]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
# RUF001 is intentionally ignored because the parser normalizes Unicode dash characters.
ignore = ["B008", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["talk2data"]

[tool.ruff.lint.per-file-ignores]
"src/talk2data/api/routes/chat.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["talk2data"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["talk2data"]
omit = [
  "src/talk2data/connectors/base.py",
  "src/talk2data/connectors/postgres.py",
  "src/talk2data/domain/evidence.py",
  "src/talk2data/domain/memory.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
