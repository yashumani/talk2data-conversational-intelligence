services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      T2D_ENVIRONMENT: development
      T2D_DATABASE_PATH: /app/.talk2data/talk2data.db
      T2D_OLLAMA_ENABLED: "true"
      T2D_OLLAMA_REQUIRED: "false"
      T2D_OLLAMA_BASE_URL: http://ollama:11434
      T2D_OLLAMA_MODEL: ${T2D_OLLAMA_MODEL:-qwen3:8b}
      T2D_HERMES_ENABLED: "false"
    volumes:
      - talk2data-state:/app/.talk2data
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama-data:
  talk2data-state:
