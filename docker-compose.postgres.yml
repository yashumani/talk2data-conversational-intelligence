services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: talk2data
      POSTGRES_USER: talk2data
      POSTGRES_PASSWORD: talk2data-local-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talk2data -d talk2data"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    environment:
      T2D_DATA_BACKEND: postgresql
      T2D_POSTGRES_DSN: postgresql://talk2data:talk2data-local-only@postgres:5432/talk2data
      T2D_POSTGRES_SCHEMA: talk2data
      T2D_POSTGRES_TABLE: metric_facts
      T2D_POSTGRES_MAXIMUM_ROWS: "1000"
      T2D_POSTGRES_QUERY_TIMEOUT_SECONDS: "60"
      T2D_POSTGRES_CONNECT_TIMEOUT_SECONDS: "10"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
