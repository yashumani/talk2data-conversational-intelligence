name: talk2data-csv-demo

# Standalone demo profile; do not combine with an internal deployment override.
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      T2D_ENVIRONMENT: development
      T2D_DATA_BACKEND: demo_sqlite
      T2D_DATABASE_PATH: /app/.talk2data/talk2data.db
      T2D_CSV_DEMO_ENABLED: "true"
      T2D_CSV_DEMO_STATE_DATABASE_PATH: /app/workspace-state/csv.db
      T2D_WEB_DIRECTORY: /app/web
      T2D_OLLAMA_ENABLED: "false"
      T2D_OLLAMA_REQUIRED: "false"
      T2D_HERMES_ENABLED: "false"
      T2D_CORS_ALLOWED_ORIGINS: '[]'
    command:
      - uvicorn
      - talk2data.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "1"
    read_only: true
    volumes:
      - csv-workspace-state:/app/workspace-state
    tmpfs:
      - /tmp
      - /app/.talk2data:uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; payload = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)); assert payload.get('status') == 'ready'"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

volumes:
  csv-workspace-state:
