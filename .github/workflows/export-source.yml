name: Export source snapshot

on:
  push:
    branches: [feat/copilotkit-foundation]
    paths:
      - ".github/workflows/export-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload repository source
        uses: actions/upload-artifact@v4
        with:
          name: talk2data-source
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
