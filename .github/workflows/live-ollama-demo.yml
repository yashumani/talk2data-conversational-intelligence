name: Live Ollama demo smoke

on:
  push:
    branches: [feat/demo-ready-ai-chat]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-ollama:
    if: ${{ !contains(github.event.head_commit.message, '[finalize-demo]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      T2D_RUN_LIVE_OLLAMA: "1"
      T2D_OLLAMA_MODEL: qwen3:0.6b
      T2D_OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ollama.log
          exit 1
      - name: Pull compact real model
        run: ollama pull "$T2D_OLLAMA_MODEL"
      - name: Run real-model contract and end-to-end demo test
        run: pytest -m live_ollama -q
      - name: Show Ollama diagnostics
        if: always()
        run: |
          ollama list || true
          tail -200 /tmp/ollama.log || true
