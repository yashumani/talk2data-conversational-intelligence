name: One-time mypy correction

on:
  push:
    branches: [feat/platform-foundation]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[mypy-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply typed classification-list correction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/talk2data/services/admissibility.py")
          text = path.read_text(encoding="utf-8")
          old = '''        classification_decisions = [
              self._policy.can_access_classification(request.access_context, item.classification)
              for item in [*metrics, *entities, *domains]
          ]'''
          new = '''        required_classifications = [
              *[metric.classification for metric in metrics],
              *[entity.classification for entity in entities],
              *[domain.classification for domain in domains],
          ]
          classification_decisions = [
              self._policy.can_access_classification(request.access_context, classification)
              for classification in required_classifications
          ]'''
          if old not in text:
              raise SystemExit("expected classification decision block was not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - run: python -m pip install -e '.[dev]'
      - run: ruff format .
      - run: ruff check .
      - run: mypy src
      - run: pytest -q
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/talk2data/services/admissibility.py
          git commit -m "fix: preserve typed classification checks"
          git push origin HEAD:feat/platform-foundation
