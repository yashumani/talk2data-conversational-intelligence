name: One-time mypy correction

on:
  push:
    branches: [feat/platform-foundation]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[mypy-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply typed classification-list correction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/talk2data/services/admissibility.py")
          text = path.read_text(encoding="utf-8")
          start_token = "classification_decisions = ["
          end_token = "denied_classifications = ["
          try:
              start_token_index = text.index(start_token)
              end_token_index = text.index(end_token, start_token_index)
          except ValueError as exc:
              raise SystemExit("expected classification decision block was not found") from exc
          start = text.rfind("\n", 0, start_token_index) + 1
          end = text.rfind("\n", 0, end_token_index) + 1
          replacement = (
              "        required_classifications = [\n"
              "            *[metric.classification for metric in metrics],\n"
              "            *[entity.classification for entity in entities],\n"
              "            *[domain.classification for domain in domains],\n"
              "        ]\n"
              "        classification_decisions = [\n"
              "            self._policy.can_access_classification(\n"
              "                request.access_context, classification\n"
              "            )\n"
              "            for classification in required_classifications\n"
              "        ]\n"
          )
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
      - run: python -m pip install -e '.[dev]'
      - run: ruff format .
      - run: ruff check .
      - run: mypy src
      - run: pytest -q
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/talk2data/services/admissibility.py
          git commit -m "fix: preserve typed classification checks"
          git push origin HEAD:feat/platform-foundation
