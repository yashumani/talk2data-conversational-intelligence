name: Enterprise candidate review
on:
  workflow_dispatch:
    inputs:
      evidence_run:
        description: "Reviewed source workflow containing the candidate-evidence artifact"
        required: true
      image_digest:
        description: "Reviewed sha256 image digest"
        required: true
      configuration_digest:
        description: "Reviewed private configuration SHA-256"
        required: true
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Download and validate the exact reviewed candidate
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN: ${{ inputs.evidence_run }}
          INPUT_IMAGE: ${{ inputs.image_digest }}
          INPUT_CONFIGURATION: ${{ inputs.configuration_digest }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from talk2data.operations.release import Candidate
          run = os.environ['INPUT_RUN']
          if not run.isdecimal():
              raise SystemExit('A numeric evidence run is required.')
          subprocess.run(['gh', 'run', 'download', run, '--repo', os.environ['GITHUB_REPOSITORY'],
                          '--name', 'candidate-evidence', '--dir', 'review-evidence'], check=True)
          candidate = Candidate(source_commit=os.environ['GITHUB_SHA'], image_digest=os.environ['INPUT_IMAGE'],
                                configuration_digest=os.environ['INPUT_CONFIGURATION'])
          supplied = Candidate.model_validate_json(Path('review-evidence/candidate.json').read_bytes())
          if supplied != candidate:
              raise SystemExit('Evidence candidate mismatch.')
          Path('candidate.json').write_text(candidate.model_dump_json())
          PY
          python -m talk2data.operations.release --candidate candidate.json \
            --manifest review-evidence/manifest.json --evidence-directory review-evidence > readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-input
          path: review-evidence/*.json
          retention-days: 7
          if-no-files-found: error
  business:
    needs: evidence
    environment: business-acceptance
    runs-on: ubuntu-latest
    steps:
      - run: echo "Business owner reviews the exact candidate and evidence in this workflow."
  security:
    needs: evidence
    environment: security-acceptance
    runs-on: ubuntu-latest
    steps:
      - run: echo "Security owner reviews the exact candidate and evidence in this workflow."
  operations:
    needs: evidence
    environment: operations-acceptance
    runs-on: ubuntu-latest
    steps:
      - run: echo "Operations owner reviews the exact candidate and evidence in this workflow."
  preserve:
    needs: [business, security, operations]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-input
          path: evidence
      - uses: actions/upload-artifact@v4
        with:
          name: enterprise-evidence
          path: evidence/*.json
          retention-days: 7
          if-no-files-found: error
  # No cloud token, deployment, data access or automatic promotion occurs in this workflow.
  # The promotion verifier independently demands real, distinct, allowlisted human approval records.
