name: Gemini live acceptance

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "requirements/**"
      - "examples/gemini/**"
      - "docker-compose.csv-gemini.yml"
      - ".github/workflows/gemini-acceptance.yml"
  workflow_dispatch:
    inputs:
      model:
        description: Gemini model approved for this synthetic benchmark and the project's billing tier
        required: true
        default: gemini-3-flash-preview
        type: string

permissions:
  contents: read

concurrency:
  group: gemini-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.config.outputs.ready }}
    steps:
      - name: Check key availability without exposing its value
        id: config
        env:
          GEMINI_ACCEPTANCE_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          ready = bool(os.environ['GEMINI_ACCEPTANCE_KEY'])
          status = 'CONFIGURED_AWAITING_MANUAL_ACCEPTANCE' if ready else 'NOT_CONFIGURED'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'ready={str(ready).lower()}\n')
          Path('gemini-configuration.json').write_text(json.dumps({'status': status}) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Gemini: **{status}**. A skipped live job is not provider validation.\n')
          print(status)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gemini-configuration
          path: gemini-configuration.json
          if-no-files-found: error

  live:
    needs: configuration
    if: github.event_name == 'workflow_dispatch' && needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      T2D_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_ACCEPTANCE_MODEL: ${{ inputs.model }}
      T2D_RUN_LIVE_GEMINI: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python scripts/dependencies.py install dev
      - name: Prepare the explicit synthetic-only model configuration
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from talk2data.core.gemini_config import GeminiConfiguration
          raw = json.loads(Path('examples/gemini/csv-preview.json').read_text())
          raw['model'] = os.environ['GEMINI_ACCEPTANCE_MODEL']
          config = GeminiConfiguration.model_validate(raw)
          path = Path(os.environ['RUNNER_TEMP']) / 'gemini-acceptance-config.json'
          path.write_text(config.model_dump_json(indent=2))
          path.chmod(0o600)
          report = Path(os.environ['RUNNER_TEMP']) / 'gemini-acceptance-report.json'
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f'T2D_GEMINI_ACCEPTANCE_CONFIG={path}\n')
              environment.write(f'T2D_GEMINI_ACCEPTANCE_REPORT={report}\n')
          PY
      - name: Verify real interpretation, exact totals, abstention and saved replay
        run: python -m pytest tests/test_live_gemini.py -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gemini-live-acceptance
          path: ${{ runner.temp }}/gemini-acceptance-report.json
          if-no-files-found: error
