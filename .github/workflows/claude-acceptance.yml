name: Claude live acceptance

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements/**"
      - "scripts/dependencies.py"
      - "examples/claude/**"
      - ".github/workflows/claude-acceptance.yml"
  workflow_dispatch:
    inputs:
      model:
        description: Approved Claude model with JSON schema output support
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: claude-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.config.outputs.ready }}
    steps:
      - name: Check explicit synthetic acceptance configuration
        id: config
        env:
          CLAUDE_ACCEPTANCE_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_ACCEPTANCE_MODEL: ${{ inputs.model || vars.T2D_CLAUDE_MODEL }}
          CLAUDE_ACCEPTANCE_APPROVED: ${{ vars.T2D_CLAUDE_ACCEPTANCE_APPROVED }}
          TRUSTED_EVENT: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          ready = bool(
              os.environ['CLAUDE_ACCEPTANCE_KEY']
              and os.environ['CLAUDE_ACCEPTANCE_MODEL']
              and os.environ['CLAUDE_ACCEPTANCE_APPROVED'] == 'true'
              and os.environ['TRUSTED_EVENT'] == 'true'
          )
          status = 'CONFIGURED_AWAITING_ACCEPTANCE' if ready else 'NOT_CONFIGURED'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'ready={str(ready).lower()}\n')
          Path('claude-configuration.json').write_text(json.dumps({'status': status}) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Claude live acceptance: **{status}**. A skipped live job is not provider validation.\n')
          print(status)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claude-configuration
          path: claude-configuration.json
          if-no-files-found: error

  live:
    needs: configuration
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      T2D_CLAUDE_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_ACCEPTANCE_MODEL: ${{ inputs.model || vars.T2D_CLAUDE_MODEL }}
      T2D_RUN_LIVE_CLAUDE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python scripts/dependencies.py install dev
      - name: Create synthetic-only acceptance configuration
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from talk2data.core.claude_config import ClaudeConfiguration
          config = ClaudeConfiguration(
              enabled=True, model=os.environ['CLAUDE_ACCEPTANCE_MODEL'], egress_approved=True,
              allowed_tenants={'demo-telecom'}, allowed_metric_ids={'MOBILE_ACTIVATIONS'},
              maximum_concurrent_requests=1,
          )
          path = Path(os.environ['RUNNER_TEMP']) / 'claude-acceptance-config.json'
          path.write_text(config.model_dump_json(indent=2))
          path.chmod(0o600)
          report = Path(os.environ['RUNNER_TEMP']) / 'claude-acceptance-report.json'
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f'T2D_CLAUDE_ACCEPTANCE_CONFIG={path}\n')
              environment.write(f'T2D_CLAUDE_ACCEPTANCE_REPORT={report}\n')
          PY
      - name: Verify real interpretation, exact totals, abstention and saved replay
        run: python -m pytest tests/test_live_claude.py -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: claude-live-acceptance
          path: ${{ runner.temp }}/claude-acceptance-report.json
          if-no-files-found: error
