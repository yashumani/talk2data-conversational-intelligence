name: Publish Talk2Data runtime image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "apps/web/**"
      - "pyproject.toml"
      - "requirements/**"
      - "scripts/dependencies.py"
      - "src/**"
      - ".github/workflows/publish-runtime-image.yml"
  pull_request:
    branches: [main, "feat/cycle-*"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "apps/web/**"
      - "pyproject.toml"
      - "requirements/**"
      - "scripts/dependencies.py"
      - "src/**"
      - ".github/workflows/publish-runtime-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: talk2data-runtime-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/talk2data-conversational-intelligence

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Governed Talk2Data runtime with Ollama interpretation and receipt-backed data execution

      - name: Build and optionally publish runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record publication boundary
        if: github.event_name != 'pull_request'
        run: |
          echo "Published ${IMAGE_NAME}:edge"
          echo "The package owner must keep the GHCR package public for anonymous tenant downloads."
