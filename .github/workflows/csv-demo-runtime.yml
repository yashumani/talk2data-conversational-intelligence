name: CSV demo release acceptance

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "src/**"
      - "pyproject.toml"
      - "requirements/**"
      - "scripts/dependencies.py"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.csv-demo.yml"
      - "docker-compose.csv-gemini.yml"
      - "examples/gemini/**"
      - "docker-compose.csv-recovery.yml"
      - "scripts/csv_workspace_smoke.py"
      - "scripts/durable_csv_smoke.py"
      - ".github/workflows/csv-demo-runtime.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "src/**"
      - "pyproject.toml"
      - "requirements/**"
      - "scripts/dependencies.py"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.csv-demo.yml"
      - "docker-compose.csv-gemini.yml"
      - "examples/gemini/**"
      - "docker-compose.csv-recovery.yml"
      - "scripts/csv_workspace_smoke.py"
      - "scripts/durable_csv_smoke.py"
      - ".github/workflows/csv-demo-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaged-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate the independent demo configuration
        run: docker compose -f docker-compose.csv-demo.yml config --quiet
      - name: Validate the optional Gemini overlay without API calls
        env:
          GEMINI_API_KEY: synthetic-configuration-only
        run: docker compose -f docker-compose.csv-demo.yml -f docker-compose.csv-gemini.yml config --quiet
      - name: Build and start the packaged workspace
        run: docker compose -f docker-compose.csv-demo.yml up --build --wait --wait-timeout 120
      - name: Verify the installed UI assets and CSV API flow
        run: python scripts/csv_workspace_smoke.py >csv-smoke-report.json
      - name: Complete a durable run before restart
        run: >-
          python scripts/durable_csv_smoke.py prepare
          --checkpoint-file "$RUNNER_TEMP/talk2data-durable-checkpoint.json"
          >durable-csv-prepare-report.json
      - name: Restart the actual API container
        run: docker compose -f docker-compose.csv-demo.yml restart api
      - name: Verify persisted answers and replay after restart
        run: >-
          python scripts/durable_csv_smoke.py verify
          --checkpoint-file "$RUNNER_TEMP/talk2data-durable-checkpoint.json"
          >durable-csv-restart-report.json
      - name: Complete a new run for backup recovery acceptance
        run: >-
          python scripts/durable_csv_smoke.py prepare
          --checkpoint-file "$RUNNER_TEMP/talk2data-restore-checkpoint.json"
          >durable-csv-restore-prepare-report.json
      - name: Quiesce the application before consistent backup
        run: docker compose -f docker-compose.csv-demo.yml stop api
      - name: Create an offline verified backup bundle
        run: >-
          docker compose -f docker-compose.csv-demo.yml run --rm --no-deps -T api
          python -m talk2data.operations.backup create
          --state /app/workspace-state/csv.db
          --destination /app/workspace-state/backup
          >csv-backup-manifest-report.json
      - name: Restore into a new directory without overwriting the source
        run: >-
          docker compose -f docker-compose.csv-demo.yml run --rm --no-deps -T api
          python -m talk2data.operations.backup restore
          --bundle /app/workspace-state/backup
          --destination /app/workspace-state/restored
          >csv-restore-manifest-report.json
      - name: Start the installed application on the restored copy
        run: >-
          docker compose -f docker-compose.csv-demo.yml -f docker-compose.csv-recovery.yml
          up --force-recreate --wait --wait-timeout 120
      - name: Verify original answers and replay on restored state
        run: >-
          python scripts/durable_csv_smoke.py verify
          --checkpoint-file "$RUNNER_TEMP/talk2data-restore-checkpoint.json"
          >durable-csv-restore-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: csv-demo-release-acceptance
          path: |
            csv-smoke-report.json
            durable-csv-prepare-report.json
            durable-csv-restart-report.json
            durable-csv-restore-prepare-report.json
            durable-csv-restore-report.json
            csv-backup-manifest-report.json
            csv-restore-manifest-report.json
          if-no-files-found: warn
      - name: Capture diagnostics on failure
        if: failure()
        run: docker compose -f docker-compose.csv-demo.yml logs --tail=100
      - name: Stop the demo
        if: always()
        run: docker compose -f docker-compose.csv-demo.yml down --volumes
      - name: Remove the private acceptance checkpoint
        if: always()
        run: rm -f "$RUNNER_TEMP/talk2data-durable-checkpoint.json" "$RUNNER_TEMP/talk2data-restore-checkpoint.json"
