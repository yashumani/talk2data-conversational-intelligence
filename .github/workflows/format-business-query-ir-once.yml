name: One-time Business Query IR formatting

on:
  push:
    branches: [feat/business-query-ir]

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[format-bqir]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.16.3
      - run: ruff format .
      - run: ruff check --fix .
      - run: git diff --check
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply Ruff formatting to Business Query IR"
          git push origin HEAD:feat/business-query-ir
