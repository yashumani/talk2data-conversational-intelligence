name: Fix onboarding quality gate

on:
  push:
    branches: [feat/data-source-onboarding]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/data-source-onboarding
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Format runtime package service
        run: ruff format src/talk2data/services/runtime_package.py
      - name: Validate complete slice
        run: |
          ruff check .
          ruff format --check .
          mypy src
          pytest --cov=talk2data --cov-report=term-missing --cov-fail-under=85
          python scripts/validate_pages_site.py
          git diff --check
      - name: Commit formatting correction
        run: |
          if git diff --quiet; then
            echo "No formatting correction was required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/talk2data/services/runtime_package.py
          git commit -m "fix: format runtime package warnings"
          git push origin HEAD:feat/data-source-onboarding
