name: Build and publish Talk2Data runtime image

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "README.md"
      - "src/**"
      - ".github/workflows/runtime-image.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "README.md"
      - "src/**"
      - ".github/workflows/runtime-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: runtime-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/yashumani/talk2data-conversational-intelligence:main
            ghcr.io/yashumani/talk2data-conversational-intelligence:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/yashumani/talk2data-conversational-intelligence
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Talk2Data Conversational Intelligence
          cache-from: type=gha
          cache-to: type=gha,mode=max
