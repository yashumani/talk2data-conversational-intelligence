name: Verify live Talk2Data product showcase

on:
  workflow_run:
    workflows: ["Deploy Talk2Data product showcase"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-url:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGE_URL: https://yashumani.github.io/talk2data-conversational-intelligence/
    steps:
      - name: Wait for and verify the public product showcase
        run: |
          for attempt in $(seq 1 120); do
            body="$(curl -fsSL "$PAGE_URL" || true)"
            if grep -Fq "Interactive product tour" <<<"$body" \
              && grep -Fq "Data paths that match the codebase" <<<"$body" \
              && grep -Fq "Fixture preview" <<<"$body" \
              && grep -Fq "ref=main" <<<"$body"; then
              echo "Verified $PAGE_URL"
              exit 0
            fi
            echo "Waiting for the GitHub Pages deployment (${attempt}/120)."
            sleep 5
          done
          echo "The expected Talk2Data product showcase was not available at $PAGE_URL."
          exit 1
