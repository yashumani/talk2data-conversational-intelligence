name: Verify live Talk2Data chat workspace

on:
  push:
    branches: [main, feat/openwebui-ui-redesign]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/verify-live-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/verify-live-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-url:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGE_URL: https://yashumani.github.io/talk2data-conversational-intelligence/
    steps:
      - name: Wait for and verify the public chat workspace
        run: |
          for attempt in $(seq 1 120); do
            body="$(curl -fsSL "$PAGE_URL" || true)"
            if grep -Fq "What do you want to know about your business?" <<<"$body" \
              && grep -Fq "Connect runtime" <<<"$body" \
              && grep -Fq "Evidence inspector" <<<"$body" \
              && grep -Fq "ref=main" <<<"$body"; then
              echo "Verified $PAGE_URL"
              exit 0
            fi
            echo "Waiting for the GitHub Pages deployment (${attempt}/120)."
            sleep 5
          done
          echo "The expected Talk2Data chat workspace was not available at $PAGE_URL."
          exit 1
