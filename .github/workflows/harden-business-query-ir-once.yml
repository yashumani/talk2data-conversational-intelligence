name: One-time Business Query IR hardening

on:
  push:
    branches: [feat/business-query-ir]

permissions:
  contents: write

jobs:
  harden:
    if: contains(github.event.head_commit.message, '[harden-bqir]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply audit-lineage and filter-authorization hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected block was not found in {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          models = Path("src/talk2data/domain/models.py")
          replace_once(
              models,
              '''class BusinessQueryIR(BaseModel):
              query_id: UUID = Field(default_factory=uuid4)
              created_at: datetime = Field(default_factory=lambda: datetime.now(UTC))
              tenant_id: str
          '''.replace("              ", "    "),
              '''class BusinessQueryIR(BaseModel):
              query_id: UUID = Field(default_factory=uuid4)
              session_id: UUID
              decision_id: UUID
              created_at: datetime = Field(default_factory=lambda: datetime.now(UTC))
              tenant_id: str
          '''.replace("              ", "    "),
          )

          compiler = Path("src/talk2data/services/query_compiler.py")
          replace_once(
              compiler,
              '''        dimensions_ids = [entity.id for entity in dimensions]
              filters = self._resolve_filters(request.question, pack, metric)
              plan_hash = self._plan_hash(
          '''.replace("              ", "        "),
              '''        dimensions_ids = [entity.id for entity in dimensions]
              filters = self._resolve_filters(request.question, pack, metric)
              try:
                  self._semantics.resolve_dimensions(
                      access=request.access_context,
                      pack=pack,
                      metric=metric,
                      dimension_ids=[item.dimension_id for item in filters],
                  )
              except DimensionNotAllowedError as exc:
                  return self._outcome(
                      session_id=session_id,
                      decision=decision,
                      status=QueryCompilationStatus.INVALID,
                      issue=CompilationIssue(
                          code="FILTER_DIMENSION_NOT_ALLOWED_FOR_METRIC",
                          message=str(exc),
                          field="filters",
                      ),
                  )
              except SemanticAccessDeniedError:
                  return self._outcome(
                      session_id=session_id,
                      decision=decision,
                      status=QueryCompilationStatus.NOT_ELIGIBLE,
                      issue=CompilationIssue(
                          code="FILTER_DIMENSION_ACCESS_DENIED",
                          message=(
                              "At least one detected filter dimension is not available to this user."
                          ),
                          field="filters",
                      ),
                  )
              plan_hash = self._plan_hash(
          '''.replace("              ", "        "),
          )
          replace_once(
              compiler,
              '''        query_ir = BusinessQueryIR(
              tenant_id=request.access_context.tenant_id,
          '''.replace("              ", "        "),
              '''        query_ir = BusinessQueryIR(
              session_id=session_id,
              decision_id=decision.decision_id,
              tenant_id=request.access_context.tenant_id,
          '''.replace("              ", "        "),
          )
          replace_once(
              compiler,
              '''        if len(iso_dates) == 2:
              start_date = date.fromisoformat(iso_dates[0])
              end_date = date.fromisoformat(iso_dates[1])
              if start_date > end_date:
          '''.replace("              ", "        "),
              '''        if len(iso_dates) == 2:
              try:
                  start_date = date.fromisoformat(iso_dates[0])
                  end_date = date.fromisoformat(iso_dates[1])
              except ValueError:
                  return (
                      None,
                      [],
                      CompilationIssue(
                          code="INVALID_EXPLICIT_DATE",
                          message="At least one explicit date is not a valid calendar date.",
                          field="time_window",
                      ),
                  )
              if start_date > end_date:
          '''.replace("              ", "        "),
          )
          replace_once(
              compiler,
              '''            selected_date = date.fromisoformat(iso_dates[0])
              return (
          '''.replace("              ", "            "),
              '''            try:
                  selected_date = date.fromisoformat(iso_dates[0])
              except ValueError:
                  return (
                      None,
                      [],
                      CompilationIssue(
                          code="INVALID_EXPLICIT_DATE",
                          message="The explicit date is not a valid calendar date.",
                          field="time_window",
                      ),
                  )
              return (
          '''.replace("              ", "            "),
          )

          fixture = Path("src/talk2data/resources/domain_packs/telecom-demo.yaml")
          replace_once(
              fixture,
              '''  - id: TECHNOLOGY
              name: Network Technology
              aliases: [technology, network technology, radio technology]
              domain_id: NETWORK_OPERATIONS
              values:
                - id: LTE
                  name: LTE
                  aliases: [4g]
                - id: FIVE_G
                  name: 5G
                  aliases: [5 g, fifth generation]
              classification: INTERNAL
          '''.replace("              ", "    "),
              '''  - id: TECHNOLOGY
              name: Network Technology
              aliases: [technology, network technology, radio technology]
              domain_id: NETWORK_OPERATIONS
              values:
                - id: LTE
                  name: LTE
                  aliases: [4g]
                - id: FIVE_G
                  name: 5G
                  aliases: [5 g, fifth generation]
              classification: RESTRICTED
          '''.replace("              ", "    "),
          )

          tests = Path("tests/test_query_compiler_api.py")
          replace_once(
              tests,
              '''    assert body["status"] == "COMPILED"
              query_ir = body["query_ir"]
              assert query_ir["metric_id"] == "POSTPAID_CHURN"
          '''.replace("              ", "    "),
              '''    assert body["status"] == "COMPILED"
              query_ir = body["query_ir"]
              assert query_ir["session_id"] == body["session_id"]
              assert query_ir["decision_id"] == body["decision"]["decision_id"]
              assert query_ir["metric_id"] == "POSTPAID_CHURN"
          '''.replace("              ", "    "),
          )
          additions = '''

          def test_rejects_invalid_explicit_calendar_date(
              client: TestClient,
              full_access: dict[str, object],
          ) -> None:
              body = compile_query(
                  client,
                  "What were mobile activations on 2026-02-30?",
                  full_access,
              )

              assert body["status"] == "INVALID"
              assert body["issues"][0]["code"] == "INVALID_EXPLICIT_DATE"
              assert body["query_ir"] is None


          def test_rechecks_classification_for_detected_filter_dimensions(
              client: TestClient,
              full_access: dict[str, object],
          ) -> None:
              body = compile_query(
                  client,
                  "What was network congestion for 5G last month?",
                  full_access,
              )

              assert body["decision"]["verdict"] == "ACCEPT_INTERNAL"
              assert body["status"] == "NOT_ELIGIBLE"
              assert body["issues"][0]["code"] == "FILTER_DIMENSION_ACCESS_DENIED"
              assert body["query_ir"] is None
          '''.replace("          ", "")
          test_text = tests.read_text(encoding="utf-8")
          if "test_rejects_invalid_explicit_calendar_date" in test_text:
              raise SystemExit("hardening tests already exist")
          tests.write_text(test_text.rstrip() + additions + "\n", encoding="utf-8")

          docs = Path("docs/semantic-registry.md")
          doc_text = docs.read_text(encoding="utf-8")
          audit_marker = "The original wording is intentionally excluded. Semantically equivalent questions therefore produce the same plan hash under the same governed context."
          audit_replacement = audit_marker + (
              "\n\nEach IR also records the originating session and admissibility-decision IDs for audit reconstruction. "
              "Those lineage IDs are intentionally excluded from the canonical plan hash."
          )
          if audit_marker not in doc_text:
              raise SystemExit("semantic registry audit marker was not found")
          doc_text = doc_text.replace(audit_marker, audit_replacement, 1)
          trust_marker = "The compiler accepts only IDs that have already passed the admissibility and semantic checks."
          trust_replacement = trust_marker + (
              " It revalidates every grouping and detected filter dimension against the user's classification clearance before emitting an IR."
          )
          if trust_marker not in doc_text:
              raise SystemExit("semantic registry trust marker was not found")
          docs.write_text(doc_text.replace(trust_marker, trust_replacement, 1), encoding="utf-8")
          PY
      - run: python -m pip install -e '.[dev]'
      - run: ruff format .
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=talk2data --cov-report=term-missing --cov-fail-under=85
      - run: rm .github/workflows/harden-business-query-ir-once.yml
      - name: Commit hardened slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix: harden Business Query IR lineage and filter authorization"
          git push origin HEAD:feat/business-query-ir
