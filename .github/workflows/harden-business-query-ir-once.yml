name: One-time Business Query IR hardening

on:
  push:
    branches: [feat/business-query-ir]

permissions:
  contents: write

jobs:
  harden:
    if: contains(github.event.head_commit.message, '[harden-bqir]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply audit-lineage and filter-authorization hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected marker was not found in {path}: {old!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          models = Path("src/talk2data/domain/models.py")
          model_marker = (
              "class BusinessQueryIR(BaseModel):\n"
              "    query_id: UUID = Field(default_factory=uuid4)\n"
          )
          replace_once(
              models,
              model_marker,
              model_marker + "    session_id: UUID\n    decision_id: UUID\n",
          )

          compiler = Path("src/talk2data/services/query_compiler.py")
          filter_marker = "        filters = self._resolve_filters(request.question, pack, metric)\n"
          filter_authorization = '''        try:
              self._semantics.resolve_dimensions(
                  access=request.access_context,
                  pack=pack,
                  metric=metric,
                  dimension_ids=[item.dimension_id for item in filters],
              )
          except DimensionNotAllowedError as exc:
              return self._outcome(
                  session_id=session_id,
                  decision=decision,
                  status=QueryCompilationStatus.INVALID,
                  issue=CompilationIssue(
                      code="FILTER_DIMENSION_NOT_ALLOWED_FOR_METRIC",
                      message=str(exc),
                      field="filters",
                  ),
              )
          except SemanticAccessDeniedError:
              return self._outcome(
                  session_id=session_id,
                  decision=decision,
                  status=QueryCompilationStatus.NOT_ELIGIBLE,
                  issue=CompilationIssue(
                      code="FILTER_DIMENSION_ACCESS_DENIED",
                      message=(
                          "At least one detected filter dimension is not available to this user."
                      ),
                      field="filters",
                  ),
              )
          '''
          replace_once(compiler, filter_marker, filter_marker + filter_authorization)

          ir_marker = "        query_ir = BusinessQueryIR(\n"
          replace_once(
              compiler,
              ir_marker,
              ir_marker
              + "            session_id=session_id,\n"
              + "            decision_id=decision.decision_id,\n",
          )

          pair_marker = (
              "        if len(iso_dates) == 2:\n"
              "            start_date = date.fromisoformat(iso_dates[0])\n"
              "            end_date = date.fromisoformat(iso_dates[1])\n"
          )
          pair_replacement = '''        if len(iso_dates) == 2:
              try:
                  start_date = date.fromisoformat(iso_dates[0])
                  end_date = date.fromisoformat(iso_dates[1])
              except ValueError:
                  return (
                      None,
                      [],
                      CompilationIssue(
                          code="INVALID_EXPLICIT_DATE",
                          message="At least one explicit date is not a valid calendar date.",
                          field="time_window",
                      ),
                  )
          '''
          replace_once(compiler, pair_marker, pair_replacement)

          single_marker = "            selected_date = date.fromisoformat(iso_dates[0])\n"
          single_replacement = '''            try:
                  selected_date = date.fromisoformat(iso_dates[0])
              except ValueError:
                  return (
                      None,
                      [],
                      CompilationIssue(
                          code="INVALID_EXPLICIT_DATE",
                          message="The explicit date is not a valid calendar date.",
                          field="time_window",
                      ),
                  )
          '''
          replace_once(compiler, single_marker, single_replacement)

          fixture = Path("src/talk2data/resources/domain_packs/telecom-demo.yaml")
          fixture_text = fixture.read_text(encoding="utf-8")
          fixture_text = fixture_text.replace('version: "2026.08.2"', 'version: "2026.08.3"', 1)
          technology_start = fixture_text.index("  - id: TECHNOLOGY\n")
          technology_end = fixture_text.index("\n\nexternal_adjacencies:", technology_start)
          technology_block = fixture_text[technology_start:technology_end]
          classification_marker = "    classification: INTERNAL\n"
          if classification_marker not in technology_block:
              raise SystemExit("TECHNOLOGY classification marker was not found")
          technology_block = technology_block.replace(
              classification_marker,
              "    classification: RESTRICTED\n",
              1,
          )
          fixture.write_text(
              fixture_text[:technology_start]
              + technology_block
              + fixture_text[technology_end:],
              encoding="utf-8",
          )

          tests = Path("tests/test_query_compiler_api.py")
          assertion_marker = (
              '    assert body["status"] == "COMPILED"\n'
              '    query_ir = body["query_ir"]\n'
              '    assert query_ir["metric_id"] == "POSTPAID_CHURN"\n'
          )
          replace_once(
              tests,
              assertion_marker,
              '    assert body["status"] == "COMPILED"\n'
              '    query_ir = body["query_ir"]\n'
              '    assert query_ir["session_id"] == body["session_id"]\n'
              '    assert query_ir["decision_id"] == body["decision"]["decision_id"]\n'
              '    assert query_ir["metric_id"] == "POSTPAID_CHURN"\n',
          )
          additions = '''

          def test_rejects_invalid_explicit_calendar_date(
              client: TestClient,
              full_access: dict[str, object],
          ) -> None:
              body = compile_query(
                  client,
                  "What were mobile activations on 2026-02-30?",
                  full_access,
              )

              assert body["status"] == "INVALID"
              assert body["issues"][0]["code"] == "INVALID_EXPLICIT_DATE"
              assert body["query_ir"] is None


          def test_rechecks_classification_for_detected_filter_dimensions(
              client: TestClient,
              full_access: dict[str, object],
          ) -> None:
              body = compile_query(
                  client,
                  "What was network congestion for 5G last month?",
                  full_access,
              )

              assert body["decision"]["verdict"] == "ACCEPT_INTERNAL"
              assert body["status"] == "NOT_ELIGIBLE"
              assert body["issues"][0]["code"] == "FILTER_DIMENSION_ACCESS_DENIED"
              assert body["query_ir"] is None
          '''.replace("          ", "")
          test_text = tests.read_text(encoding="utf-8")
          if "test_rejects_invalid_explicit_calendar_date" in test_text:
              raise SystemExit("hardening tests already exist")
          tests.write_text(test_text.rstrip() + additions + "\n", encoding="utf-8")

          for test_path in (
              Path("tests/test_admissibility_api.py"),
              Path("tests/test_semantics_api.py"),
          ):
              text = test_path.read_text(encoding="utf-8")
              if "2026.08.2" not in text:
                  raise SystemExit(f"expected Domain Pack version was not found in {test_path}")
              test_path.write_text(text.replace("2026.08.2", "2026.08.3"), encoding="utf-8")

          docs = Path("docs/semantic-registry.md")
          doc_text = docs.read_text(encoding="utf-8")
          audit_marker = (
              "The original wording is intentionally excluded. Semantically equivalent questions "
              "therefore produce the same plan hash under the same governed context."
          )
          audit_replacement = audit_marker + (
              "\n\nEach IR also records the originating session and admissibility-decision IDs "
              "for audit reconstruction. Those lineage IDs are intentionally excluded from the "
              "canonical plan hash."
          )
          if audit_marker not in doc_text:
              raise SystemExit("semantic registry audit marker was not found")
          doc_text = doc_text.replace(audit_marker, audit_replacement, 1)
          trust_marker = (
              "The compiler accepts only IDs that have already passed the admissibility and semantic "
              "checks."
          )
          trust_replacement = trust_marker + (
              " It revalidates every grouping and detected filter dimension against the user's "
              "classification clearance before emitting an IR."
          )
          if trust_marker not in doc_text:
              raise SystemExit("semantic registry trust marker was not found")
          docs.write_text(doc_text.replace(trust_marker, trust_replacement, 1), encoding="utf-8")
          PY
      - run: python -m pip install -e '.[dev]'
      - run: ruff format .
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=talk2data --cov-report=term-missing --cov-fail-under=85
      - run: rm .github/workflows/harden-business-query-ir-once.yml
      - name: Commit hardened slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix: harden Business Query IR lineage and filter authorization"
          git push origin HEAD:feat/business-query-ir
