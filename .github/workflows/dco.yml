name: DCO

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: DCO sign-off
    # Dependabot cannot add a Signed-off-by trailer. Skip only pull requests that it opened.
    # A job skipped by its condition reports success to a required status check.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact author-matching sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/validate_dco.py --base "$BASE_SHA" --head "$HEAD_SHA"
