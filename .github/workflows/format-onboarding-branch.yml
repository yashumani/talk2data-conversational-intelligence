name: One-time format onboarding branch

on:
  push:
    branches: [feat/data-source-onboarding-package]
    paths:
      - ".github/workflows/format-onboarding-branch.yml"

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/data-source-onboarding-package
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'ruff>=0.9,<1'
      - name: Apply repository formatter
        run: ruff format .
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Apply repository formatting [skip format]"
          git push origin HEAD:feat/data-source-onboarding-package
