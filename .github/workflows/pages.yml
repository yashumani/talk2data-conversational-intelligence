name: Build and deploy static visualization gallery

on:
  pull_request:
    branches: [main]
    paths: ["apps/web/**", "contracts/**", "site/**", "VERSION", "LICENSE", "THIRD_PARTY_NOTICES.md", "scripts/prepare_pages_release.py", "scripts/validate_pages_site.py", ".github/workflows/pages.yml"]
  push:
    branches: [main]
    paths: ["apps/web/**", "contracts/**", "site/**", "VERSION", "LICENSE", "THIRD_PARTY_NOTICES.md", "scripts/prepare_pages_release.py", "scripts/validate_pages_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Validate source profile
        run: python scripts/validate_pages_site.py
      - name: Install exact web dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts
      - name: Build dedicated static gallery
        working-directory: apps/web
        run: npm run build:pages
      - name: Stamp exact source and license receipt
        run: python scripts/prepare_pages_release.py --source-sha "$GITHUB_SHA"
      - name: Validate release artifact
        run: python scripts/validate_pages_site.py --profile release --source-sha "$GITHUB_SHA"
      - name: Upload immutable Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy exact artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
