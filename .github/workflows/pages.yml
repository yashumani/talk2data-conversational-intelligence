name: Deploy Talk2Data UI to GitHub Pages

on:
  push:
    branches: [feat/github-pages-demo]
    paths:
      - "site/**"
      - "scripts/validate_pages_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure or enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.PAGES_ADMIN_TOKEN || github.token }}

      - name: Write public runtime configuration
        env:
          T2D_PUBLIC_API_BASE_URL: ${{ vars.T2D_PUBLIC_API_BASE_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = os.environ.get("T2D_PUBLIC_API_BASE_URL", "").strip().rstrip("/")
          Path("site/config.js").write_text(
              f"window.T2D_PUBLIC_API_BASE_URL = {json.dumps(value)};\n",
              encoding="utf-8",
          )
          PY

      - name: Validate static site
        run: python scripts/validate_pages_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
