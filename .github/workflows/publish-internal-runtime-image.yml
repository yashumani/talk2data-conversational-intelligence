name: Build and publish internal runtime image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.internal"
      - ".dockerignore"
      - "apps/web/**"
      - "pyproject.toml"
      - "requirements/**"
      - "scripts/dependencies.py"
      - "README.md"
      - "src/**"
      - ".github/workflows/publish-internal-runtime-image.yml"
  pull_request:
    branches: [main, "feat/cycle-*"]
    paths:
      - "Dockerfile.internal"
      - ".dockerignore"
      - "apps/web/**"
      - "pyproject.toml"
      - "requirements/**"
      - "scripts/dependencies.py"
      - "README.md"
      - "src/**"
      - ".github/workflows/publish-internal-runtime-image.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the exact main revision to GHCR after environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: internal-runtime-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/talk2data-internal

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the signed internal workspace and Python runtime
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.internal
          push: false
          tags: ${{ env.IMAGE_NAME }}:validation-${{ github.sha }}
          cache-from: type=gha,scope=talk2data-internal
          cache-to: type=gha,mode=max,scope=talk2data-internal

  publish:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: internal-image-publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out exact main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Talk2Data signed internal BigQuery or Parquet runtime

      - name: Publish internal runtime by source SHA
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.internal
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=talk2data-internal
          cache-to: type=gha,mode=max,scope=talk2data-internal

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Write publication receipt
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_sha": os.environ["GITHUB_SHA"],
              "image": os.environ["IMAGE_NAME"],
              "tags": os.environ["IMAGE_TAGS"].splitlines(),
              "digest": os.environ["IMAGE_DIGEST"],
              "dockerfile": "Dockerfile.internal",
              "workflow_run": (
                  f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}'
                  f'/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
              ),
          }
          if len(receipt["source_sha"]) != 40 or not receipt["digest"].startswith("sha256:"):
              raise SystemExit("Refusing to record an incomplete internal image receipt.")
          Path("internal-image-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload digest-only publication receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: internal-image-receipt-${{ github.sha }}
          path: internal-image-receipt.json
          if-no-files-found: error
          retention-days: 30
