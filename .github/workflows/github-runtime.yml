name: Validate GitHub-native Talk2Data runtime

on:
  push:
    branches: [main, feat/github-native-runtime]
    paths:
      - ".devcontainer/**"
      - "docker-compose.yml"
      - "Dockerfile"
      - "src/**"
      - "scripts/demo_smoke.py"
      - "scripts/validate_codespaces_config.py"
      - ".github/workflows/github-runtime.yml"
  pull_request:
    branches: [main, feat/github-pages-demo]
    paths:
      - ".devcontainer/**"
      - "docker-compose.yml"
      - "Dockerfile"
      - "src/**"
      - "scripts/demo_smoke.py"
      - "scripts/validate_codespaces_config.py"
      - ".github/workflows/github-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Validate Codespaces contract
        run: python scripts/validate_codespaces_config.py
      - name: Validate merged Compose configuration
        env:
          T2D_OLLAMA_MODEL: qwen3:0.6b
        run: >-
          docker compose
          -f docker-compose.yml
          -f .devcontainer/docker-compose.codespaces.yml
          config

  full-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      T2D_OLLAMA_MODEL: qwen3:0.6b
      COMPOSE_PROJECT_NAME: talk2data-github-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install httpx
      - name: Start the complete Docker runtime
        run: >-
          docker compose
          -f docker-compose.yml
          -f .devcontainer/docker-compose.codespaces.yml
          up -d --build
      - name: Wait for Talk2Data readiness
        run: |
          for attempt in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8000/health/ready >/tmp/readiness.json; then
              cat /tmp/readiness.json
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Execute end-to-end governed chat smoke
        run: python scripts/demo_smoke.py --base-url http://127.0.0.1:8000
      - name: Capture runtime diagnostics
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f .devcontainer/docker-compose.codespaces.yml \
            ps || true
          docker compose \
            -f docker-compose.yml \
            -f .devcontainer/docker-compose.codespaces.yml \
            logs --tail=250 || true
      - name: Stop runtime
        if: always()
        run: >-
          docker compose
          -f docker-compose.yml
          -f .devcontainer/docker-compose.codespaces.yml
          down -v
