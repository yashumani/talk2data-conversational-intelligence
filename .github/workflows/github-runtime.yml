name: Validate GitHub-native CSV workspace

on:
  push:
    branches: [main, "feat/cycle-*"]
    paths:
      - ".devcontainer/**"
      - "docker-compose.csv-demo.yml"
      - "Dockerfile"
      - "pyproject.toml"
      - "requirements/**"
      - "scripts/dependencies.py"
      - ".dockerignore"
      - "apps/web/**"
      - "src/**"
      - "scripts/csv_workspace_smoke.py"
      - "scripts/validate_codespaces_config.py"
      - ".github/workflows/github-runtime.yml"
  pull_request:
    branches: [main, "feat/cycle-*"]
    paths:
      - ".devcontainer/**"
      - "docker-compose.csv-demo.yml"
      - "Dockerfile"
      - "pyproject.toml"
      - "requirements/**"
      - "scripts/dependencies.py"
      - ".dockerignore"
      - "apps/web/**"
      - "src/**"
      - "scripts/csv_workspace_smoke.py"
      - "scripts/validate_codespaces_config.py"
      - ".github/workflows/github-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python scripts/dependencies.py install dev
      - name: Validate Codespaces contract
        run: python scripts/validate_codespaces_config.py
      - name: Validate merged Compose configuration
        run: >-
          docker compose
          -f docker-compose.csv-demo.yml
          -f .devcontainer/docker-compose.codespaces.yml
          config

  csv-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: talk2data-github-runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Start the Codespaces CSV runtime
        run: >-
          docker compose
          -f docker-compose.csv-demo.yml
          -f .devcontainer/docker-compose.codespaces.yml
          up -d --build
      - name: Wait for Talk2Data readiness
        run: |
          for attempt in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8000/health/ready >/tmp/readiness.json \
              && python -c 'import json, sys; health_payload = json.load(sys.stdin); raise SystemExit(health_payload.get("status") != "ready")' \
                </tmp/readiness.json; then
              cat /tmp/readiness.json
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Execute the React and CSV workspace acceptance smoke
        run: python scripts/csv_workspace_smoke.py --base-url http://127.0.0.1:8000
      - name: Capture runtime diagnostics
        if: always()
        run: |
          docker compose \
            -f docker-compose.csv-demo.yml \
            -f .devcontainer/docker-compose.codespaces.yml \
            ps || true
          docker compose \
            -f docker-compose.csv-demo.yml \
            -f .devcontainer/docker-compose.codespaces.yml \
            logs --tail=250 || true
      - name: Stop runtime
        if: always()
        run: >-
          docker compose
          -f docker-compose.csv-demo.yml
          -f .devcontainer/docker-compose.codespaces.yml
          down -v
