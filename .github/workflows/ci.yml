name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      state-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: state_acceptance
          POSTGRES_USER: talk2data
          POSTGRES_PASSWORD: synthetic-state-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U talk2data -d state_acceptance"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      T2D_RUN_STATE_TESTS: "1"
      T2D_TEST_STATE_DSN: postgresql://talk2data:synthetic-state-test@127.0.0.1:5432/state_acceptance
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python scripts/dependencies.py install dev
      - run: python scripts/validate_workflows.py
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov=talk2data --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=96
      - run: python scripts/check_coverage.py
      - name: Enforce coverage for dependency and workflow guards
        run: >-
          pytest tests/test_build_hardening.py
          --cov=scripts.dependencies --cov=scripts.validate_workflows
          --cov-report=term-missing --cov-report=json:build-tool-coverage.json
          --cov-fail-under=96
      - name: Verify incomplete evidence blocks a production release
        run: |
          if python -m talk2data.operations.release \
            --candidate examples/release/candidate.example.json \
            --manifest examples/release/evidence.example.json \
            --evidence-directory examples/release >release-readiness-report.json; then
            echo "The empty example evidence must never authorize a release."
            exit 1
          else
            test "$?" -eq 1
          fi
          python -c 'import json; r=json.load(open("release-readiness-report.json")); assert r["status"] == "BLOCKED" and not r["deployment_authorized"]'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-coverage-${{ matrix.python-version }}
          path: |
            coverage.json
            build-tool-coverage.json
            release-readiness-report.json
          if-no-files-found: error
