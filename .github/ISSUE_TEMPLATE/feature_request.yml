name: Feature request
description: Propose a bounded capability or visualization matrix item.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user outcome
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Name the registry ID when proposing visualization work.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security and data-boundary impact
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
